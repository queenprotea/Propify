server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Tamaño máximo de subida (imágenes / documentos)
    client_max_body_size 10m;

    # Las llamadas al API se reenvían al gateway.
    location /api/ {
        proxy_pass http://gateway:80/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Las imágenes servidas por property-service vía gateway.
    location /static/ {
        proxy_pass http://gateway:80/api/properties/static/;
    }

    # SPA: cualquier ruta desconocida devuelve index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
