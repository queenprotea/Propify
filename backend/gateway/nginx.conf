# API Gateway — punto único de entrada a los microservicios.
# El barra final en proxy_pass elimina el prefijo /api/<servicio>/ antes de
# reenviar la petición, de modo que cada servicio recibe sus rutas en la raíz
# (p. ej. /api/users/login  ->  user_service:8001/login).

upstream user_service     { server user_service:8001; }
upstream property_service { server property_service:8002; }
upstream contract_service { server contract_service:8000; }
upstream payment_service  { server payment_service:8003; }

server {
    listen 80;
    server_name _;

    # Tamaño máximo de subida (imágenes / contratos firmados)
    client_max_body_size 10m;

    location /api/users/ {
        proxy_pass http://user_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/properties/ {
        proxy_pass http://property_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/contracts/ {
        proxy_pass http://contract_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/payments/ {
        proxy_pass http://payment_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location = /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
